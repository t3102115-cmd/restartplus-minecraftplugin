name: RestartPlus
version: 1.0
main: de.example.restartplus.RestartPlus
api-version: 1.21
commands:
  restartp:
    description: Restart with countdown
    usage: /restartp <seconds> <announce true|false> <reason (optional)>
    permission: restartplus.restart
  stopp:
    description: Stop with countdown
    usage: /stopp <seconds> <announce true|false> <reason (optional)>
    permission: restartplus.stop
  cancelrestart:
    description: Cancel restart
    permission: restartplus.cancelrestart
  cancelstop:
    description: Cancel stop
    permission: restartplus.cancelstop
permissions:
  restartplus.restart:
    default: op
  restartplus.stop:
    default: op
  restartplus.cancelrestart:
    default: op
  restartplus.cancelstop:
    default: op
